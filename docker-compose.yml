services:
  canis-den:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://link.canis.world
        INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://host.docker.internal:7344}
    image: canis-den:latest
    pull_policy: build
    container_name: link_canis_world
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 7342
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://host.docker.internal:7344}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7342:7342"
